name: PA AP branch regression tests
on:
  push:
    branches:
      - fix/pa-ap-alerts-dry-run-20261104
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_CALENDAR_SYNC_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Full unit test suite
        run: python -m unittest discover -s tests -v
