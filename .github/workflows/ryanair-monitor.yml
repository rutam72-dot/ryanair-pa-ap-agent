name: Ryanair PA AP monitor
on:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:
  push:
    paths:
      - 'state/monitor-test-trigger.txt'
permissions:
  contents: write
concurrency:
  group: ryanair-pa-ap-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        id: unit_tests
        run: python -m unittest discover -s tests -v
      - name: Fetch confirmed Ryanair fares (calendar writes by ChatGPT)
        id: fare_fetch
        env:
          RYANAIR_HORIZON_DAYS: "365"
          GOOGLE_CALENDAR_SYNC_ENABLED: "0"
        run: python monitor.py
      - name: Save run diagnostic record
        if: ${{ always() }}
        env:
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          FARE_FETCH_OUTCOME: ${{ steps.fare_fetch.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Warsaw"))
          p = Path("state/latest_verified.json")
          try:
              prices = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          except (ValueError, OSError):
              prices = {}
          fresh_count = 0
          for item in prices.values() if isinstance(prices, dict) else []:
              try:
                  observed = datetime.fromisoformat(item["observed_at"])
                  if now - timedelta(hours=8) <= observed <= now + timedelta(minutes=5):
                      fresh_count += 1
              except (KeyError, TypeError, ValueError):
                  continue
          result = {
              "checked_at_warsaw": now.isoformat(timespec="seconds"),
              "tests": os.environ.get("UNIT_TESTS_OUTCOME"),
              "fare_fetch": os.environ.get("FARE_FETCH_OUTCOME"),
              "fresh_verified_price_count": fresh_count,
              "calendar_write_owner": "ChatGPT",
              "github_calendar_writes_enabled": False,
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trigger": os.environ.get("GITHUB_EVENT_NAME"),
          }
          out = Path("state/last_run.json")
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("Saved Ryanair PA/AP diagnostic record:", result)
          PY
      - name: Commit confirmed fare history, observation times and diagnostics
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain -- state/history.json state/latest_verified.json state/last_run.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- state/history.json state/latest_verified.json state/last_run.json
            git commit -m "Update Ryanair prices and run diagnostics"
            git push
          fi
