name: Ryanair single-calendar monitor
on:
  schedule:
    - cron: '7 * * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      mode:
        description: Preview reads Ryanair only; apply writes the single calendar
        type: choice
        default: preview
        options: [preview, apply]
  push:
    paths: ['**.py', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['**.py', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  branch-preview:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/prepare/simple-free-') &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read live Ryanair offers without Google access
        run: python monitor.py preview
  monitor:
    needs: tests
    concurrency:
      group: ryanair-single-calendar
      cancel-in-progress: false
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      ((github.event_name == 'schedule' && vars.RYANAIR_SIMPLE_ENABLED == '1') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preview (no Google access or state writes)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: python monitor.py preview
      - name: Require explicit activation for writes
        if: github.event_name == 'schedule' || inputs.mode == 'apply'
        env:
          ENABLED: ${{ vars.RYANAIR_SIMPLE_ENABLED }}
        run: |
          test "$ENABLED" = "1" || { echo "::error::Set RYANAIR_SIMPLE_ENABLED=1 after reviewing the preview"; exit 1; }
      - name: Stage durable plan
        id: stage
        if: github.event_name == 'schedule' || inputs.mode == 'apply'
        run: python monitor.py stage
      - name: Publish plan before any Calendar write
        id: publish
        if: steps.stage.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/runtime.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage single-calendar Ryanair observations"
            git push
          fi
      - name: Deliver and verify
        id: delivery
        if: steps.publish.outcome == 'success'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python monitor.py deliver
      - name: Persist acknowledgements, including partial delivery
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: |
          git add -- state/runtime.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified single-calendar delivery progress"
            git push
          fi
      - name: Check freshness and remaining work
        if: ${{ always() && steps.publish.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("state/runtime.json").read_text())
          diagnostic = state["diagnostic"]
          print(json.dumps({"diagnostic": diagnostic,
                            "pending_operations": len(state["outbox"]),
                            "weekly_pending": state["weekly_pending"]}, ensure_ascii=False))
          if not diagnostic.get("complete") or state["outbox"] or state["weekly_pending"]:
              raise SystemExit("Partial data or delivery: inspect log; preserved state will be retried")
          PY
