name: Ryanair PA AP monitor
on:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ryanair-pa-ap-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch confirmed fares and update Google calendars
        env:
          RYANAIR_HORIZON_DAYS: "365"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python monitor.py
      - name: Commit updated history
        if: ${{ always() }}
        run: |
          if [ -f state/history.json ] && ! git diff --quiet -- state/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/history.json
            git commit -m "Update confirmed Ryanair fare history"
            git push
          elif [ -f state/history.json ] && ! git ls-files --error-unmatch state/history.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/history.json
            git commit -m "Initialize confirmed Ryanair fare history"
            git push
          fi
