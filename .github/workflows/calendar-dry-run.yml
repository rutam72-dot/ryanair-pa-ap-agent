name: Google Calendar read-only dry run
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Google read-only API dependencies
        run: python -m pip install -r requirements-calendar.txt
      - name: Verify credentials are configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON secret. Configure a service account with reader access to all 3 calendars."
            exit 1
          fi
      - name: Preview without calendar writes
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_IDS: rutam72@gmail.com,b.prokglock@gmail.com,ryanairsamolot@gmail.com
        run: python calendar_dry_run.py
